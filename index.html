<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nexora_mascot_new.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora - Your Personal Flow Companion</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0D1B4C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Nexora">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <link rel="apple-touch-icon" href="/nexora_mascot_new.png">
    
    <!-- Preload critical core assets so they render instantly with zero delay -->
    <link rel="preload" as="image" href="/nexora_mascot_new.png" fetchpriority="high">
    <link rel="preload" as="image" href="/login-bg.jpg" fetchpriority="high">

    <!-- Synchronous early capture of beforeinstallprompt to ensure it is never missed before scripts load -->
    <script>
      (function() {
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__nexora_deferred_prompt = e;
          window.dispatchEvent(new CustomEvent('nexora:pwa-prompt-ready', { detail: e }));
        });
        window.addEventListener('appinstalled', function() {
          window.__nexora_deferred_prompt = null;
          window.dispatchEvent(new CustomEvent('nexora:pwa-installed'));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
